name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        # Same kernel 6.19+ workaround as docker-compose.yml.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The e2e suite stubs the model, so CI needs no API keys.
      - run: pnpm test:e2e
      - run: pnpm build
      # Vitest compiles TypeScript its own way, so also boot the built API with
      # plain Node to catch ESM import problems the tests cannot see.
      - name: Boot the built API
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/studies > /dev/null && exit 0
            sleep 1
          done
          echo "The API did not start" && exit 1
